[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sepia"
version = "0.1.0"
description = "Processing of Sepia officinalis iNaturalist records (cuttlebones, barnacle rafting)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "requests>=2.31", "pillow>=10.0", "openpyxl>=3.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
