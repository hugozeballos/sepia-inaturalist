# Sector A de Martin: Western North Sea (PPT SepiaFORhugo21oct2026.pptx, diap. 12).
# Rectangulo y zonas excluidas en configs/sectors.yaml (esquina suroeste estimada: ver ese archivo).
# Ojo: pilot_a1 (A1) y a2_test (A2) ya cubren casi todo A con rectangulos aproximados; esta
# corrida baja solo lo que falta (skip_ids_from). PENDIENTE con Martin: el borde norte de A
# (57.83 N) deja fuera Thurso y la costa norte de Escocia, que estaban en su A1.
# Se baja TODO lo del rectangulo, sin filtrar: el sector de cada registro se asigna al final (Excel).
# Los rectangulos se cruzan (B y C en el sureste de Inglaterra), asi que se bajan EN ORDEN
# B -> C -> D -> E -> A, y cada uno salta lo que ya esta en las corridas anteriores (skip_ids_from).
# Antes de descargar:  python scripts/download.py --config configs/sector_a.yaml --count-only
base_dir: /content/drive/MyDrive/sepia-inaturalist/data/sector_a
taxon_id: 151429                 # Sepia officinalis
sector: A                       # bbox = rectangulo del sector (configs/sectors.yaml)
photo_size: original
resize: [512, 1024]
skip_ids_from: [pilot_a1, a2_test, sector_b, sector_c, sector_d, sector_e]
sheet_name: A                   # hoja de registros en el Excel

# Triaje (scripts/triage.py). Clave en la variable de entorno GEMINI_API_KEY.
triage:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0
  prompt_version: triage_v2
  image_size: 512
  requests_per_minute: 8
  thinking_level: low
  timeout_s: 120

# Rasgos por foto (el notebook 01 corre v14, v13, v12 y v8)
photo_traits:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0
  prompt_version: photo_traits_v14
  image_size: 1024
  requests_per_minute: 8
  thinking_level: low
  timeout_s: 120

# Recuadro del hueso (scripts/bonebox.py): solo fotos con 1 hueso segun photo_traits_v14
bonebox:
  prompt_version: bonebox_v1
  select_from: photo_traits_v14
