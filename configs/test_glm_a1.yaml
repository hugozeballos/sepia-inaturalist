# PRUEBA (11 nov 2026): GLM-4.6V-Flash (Z.ai, gratis) sobre fotos YA ANOTADAS del piloto A1.
# Mismos datos que pilot_a1 (misma carpeta), otro modelo: sus respuestas van a archivos propios
# (outputs/<paso>_zai_glm-4.6v-flash_<version>.jsonl), no tocan las de Gemini.
# Clave en la variable de entorno ZAI_API_KEY. Notebook: notebooks/90_prueba_glm.ipynb
base_dir: /content/drive/MyDrive/sepia-inaturalist/data/pilot_a1
taxon_id: 151429
bbox: [54.9, -3.6, 58.7, -1.0]
photo_size: original
resize: [512, 1024]
sheet_name: A1

triage:
  provider: zai
  model: glm-4.6v-flash
  temperature: 0
  prompt_version: triage_v2
  image_size: 512
  requests_per_minute: 40         # limite gratuito informado: ~1 por segundo
  thinking_level: null            # sin razonamiento (mas rapido)
  timeout_s: 180

photo_traits:
  provider: zai
  model: glm-4.6v-flash
  temperature: 0
  prompt_version: photo_traits_v14
  image_size: 1024
  requests_per_minute: 40
  thinking_level: null
  timeout_s: 180

bonebox:
  prompt_version: bonebox_v1
  select_from: photo_traits_v14   # v14 de GLM (esta misma config)
